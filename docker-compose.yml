services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier-lens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      TZ: Asia/Seoul
      PGTZ: Asia/Seoul

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atelier-lens-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Inside the compose network the DB is reachable by service name, not
      # localhost -- override whatever DATABASE_URL is set to in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TZ: Asia/Seoul

    ports:
      - "8000:8000"

    volumes:
      - api_data:/data

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  api_data:
