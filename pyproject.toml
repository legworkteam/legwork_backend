[project]
name = "atelier-lens-backend"
version = "0.1.0"
description = "Atelier Lens FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0,<0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "sqlalchemy[asyncio]>=2.0.42,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.16.0,<2.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "pyjwt>=2.10.0,<3.0.0",
    "bcrypt>=4.3.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<0.29.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
